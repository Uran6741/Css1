<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 18 - Konrad Jankowski</title>
</head>
<body>
    <!--    początek bloku DIV  1       -->
    <div style="background-color: yellow; width: 1089px;">
        <span style="color: red; font-size: 1.5cm; font-family: Arial;">
            Znacznik DIV (blok 1)-->Jankowski
        </span>
        <br />
        <span style="font-size: 1.1cm; font-family: Times New Roman;">
            <b><u>Element blokowy (DIV)</u></b> jest elementem blokowym może zawierać
            wewnątrz siebie zwykły tekst, jak również inne elementy blokowe. Został on
            pomyślany do tworzenia obszerniejszych struktur.
        </span>
        <span style="font-family: Arial, Helvetica, sans-serif; font-size: 0.7cm;"><br />
            Zastosowanie DIV
            <ul type="square">
                <li>
                    Z div'a powinno się korzystać kiedy potrzebujemy wyodrębnić poszczególne
                    bloki w układzie dokumentu, na przykład lewa kolumna, menu nawigacyjne,
                    stopka.
                </li>
                <li>Służy do utworzenia sekcji (bloku) w pliku HTML w celu ich sformatowania za pomocą
                    arkusza stylów CSS.</li>
            </ul>
        </span>
    </div>
    <!--    koniec bloku DIV  1       -->
    
    <br><br>
    
    <!--    początek bloku DIV  2       -->
    <div style="background-color: lime; width: 1089px;">
        <span style="color: blue; font-size: 1.5cm; font-family: Arial;">
            Znacznik SPAN (blok 2)-->Jankowski
        </span>
        <br />
        <span style="font-size: 1.1cm; font-family: Times New Roman;">
            <b><u>Element liniowy (SPAN)</u></b> jest elementem liniowym, który nie powoduje
            przejścia do nowej linii. Służy do formatowania fragmentów tekstu wewnątrz
            innych elementów.
        </span>
        <span style="font-family: Arial, Helvetica, sans-serif; font-size: 0.7cm;"><br />
            Zastosowanie SPAN
            <ul type="square">
                <li>
                    Z span'u powinno się korzystać kiedy potrzebujemy zmienić styl fragmentu
                    tekstu wewnątrz akapitu lub innego elementu blokowego.
                </li>
                <li>Służy do grupowania elementów liniowych w celu ich sformatowania za pomocą
                    arkusza stylów CSS.</li>
            </ul>
        </span>
    </div>
    <!--    koniec bloku DIV  2       -->
    
    <br><br>
    
    <!--    początek bloku DIV  3       -->
    <div style="background-color: cyan; width: 1089px;">
        <span style="color: purple; font-size: 1.5cm; font-family: Arial;">
            Różnica DIV i SPAN (blok 3)-->Jankowski
        </span>
        <br />
        <span style="font-size: 1.1cm; font-family: Times New Roman;">
            <b><u>Różnica między DIV a SPAN</u></b> polega na sposobie wyświetlania.
            DIV jest elementem blokowym, SPAN jest elementem liniowym.
        </span>
        <span style="font-family: Arial, Helvetica, sans-serif; font-size: 0.7cm;"><br />
            Kluczowe różnice
            <ul type="square">
                <li>
                    DIV zajmuje całą szerokość i powoduje przejście do nowej linii.
                </li>
                <li>SPAN nie powoduje przejścia do nowej linii i zajmuje tylko tyle miejsca ile potrzebuje.</li>
            </ul>
        </span>
    </div>
    <!--    koniec bloku DIV  3       -->
