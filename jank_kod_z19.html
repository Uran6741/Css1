<!DOCTYPE html>

<body>
    <h1>Zadanie 19 - Połączenie trzech przykładów DIV i SPAN</h1>
    
    <h2>Przykład 1:</h2>
    <div style="background-color: silver;">
        <span style="color: green;">
            <b>To jest pogrubienie w ramach DIV oraz SPAN i dlatego jest zielone na srebrnym tle</b>,
            a to jest zwykły tekst - również wewnątrz DIV i SPAN.
        </span>
        To jest zwykły tekst, ale tylko wewnątrz DIV - dlatego nie jest zielone, ale ma srebrne tło.
        <p style="color: red; font-size: 40mm;">A to jest akapit (element blokowy) w ramach DIV.</p>
    </div>
    
    <br><br>
    
    <h2>Przykład 2:</h2>
    <span style="color: green; font-size: 25mm;">
        <b>To jest pogrubienie (element wyświetlany w linii) w ramach SPAN</b>,
        a to jest zwykły tekst - również wewnątrz span.
    </span>
    
    <br><br>
    
    <h2>Przykład 3 - Kolorowe wyliczenie z użyciem styli wpisanych:</h2>
    <ol>
        <li style="color: rgb(128, 0, 128);"><span style="color: black;">Punkt pierwszy</span></li>
        <li style="color: rgb(255, 192, 203);"><span style="color: black;">Punkt drugi</span></li>
        <li style="color: rgb(173, 216, 230);"><span style="color: black;">Punkt trzeci</span></li>
    </ol>
